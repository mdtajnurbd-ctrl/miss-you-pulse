<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miss You Pulse ❤️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #2b094e, #120424);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 410px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 24px;
      text-align: center;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .pair-box {
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0 20px;
      font-size: 14px;
      gap: 8px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 14px;
    }
    .num { font-size: 32px; font-weight: 700; margin: 6px 0; }
    .big-heart-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: linear-gradient(145deg, #ff4d79, #b51746);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .big-heart-btn:active { transform: scale(0.92); }
    .last-msg {
      margin-top: 18px;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      border-radius: 14px;
      font-size: 13px;
      color: #f3d5de;
      line-height: 1.45;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }
    .modal.show { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 380px;
      max-height: 88vh;
      overflow-y: auto;
      background: #240b42;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 22px;
      padding: 20px;
      text-align: left;
    }
    .modal-box h3 { margin-bottom: 12px; font-size: 18px; }
    .modal-box label { display: block; font-size: 12.5px; margin-bottom: 4px; color: #e2d4f0; }
    .modal-box input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 14px;
      margin-bottom: 11px;
    }
    .modal-btns { display: flex; gap: 10px; margin-top: 6px; }
    .save-btn {
      flex: 1;
      background: #ff4d79;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span id="statusText" style="font-size:13px; color:#86efac;">● সেভ মোড চালু</span>
      <div>
        <button type="button" class="btn" onclick="askNotify()">🔔 অ্যালার্ট</button>
        <button type="button" class="btn" onclick="openModal('settingsModal')">⚙️</button>
      </div>
    </div>

    <h2>দূরে থেকেও কাছে ❤️</h2>
    <p style="font-size:13px; color:#e5d4f7; margin-top:4px;">আজকের স্মরণের হিসাব</p>

    <div class="pair-box">
      <span id="pairText">আমি ❤️ hasi</span>
      <button type="button" class="btn" onclick="openModal('profileModal')">ইউজার বদলান</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div id="myLabel" style="font-size:12px; color:#e5d4f7;">আজ আমি</div>
        <div id="myNum" class="num">0</div>
        <div style="font-size:12px; color:#ffd166;">বার ❤️</div>
      </div>
      <div class="stat">
        <div id="partnerLabel" style="font-size:12px; color:#e5d4f7;">আজ hasi</div>
        <div id="partnerNum" class="num">0</div>
        <div style="font-size:12px; color:#ffd166;">বার 💕</div>
      </div>
    </div>

    <button type="button" class="big-heart-btn" onclick="addCount()">
      <span style="font-size:34px;">💖</span>
      <span>মনে পড়ছে!</span>
    </button>

    <div id="lastMsg" class="last-msg">এখনও কোনো সিগন্যাল পাঠানো হয়নি ✨</div>
  </div>

  <!-- ইউজার বদলানোর বক্স -->
  <div id="profileModal" class="modal">
    <div class="modal-box">
      <h3>ইউজারনেম বদলান</h3>
      <label>আমার নাম / ইউজারনেম</label>
      <input type="text" id="inMyName" />
      <label>প্রিয়জনের নাম / ইউজারনেম</label>
      <input type="text" id="inPartnerName" />
      <div class="modal-btns">
        <button type="button" class="btn" onclick="closeModal('profileModal')">বন্ধ</button>
        <button type="button" class="save-btn" onclick="saveNames()">সেভ করুন</button>
      </div>
    </div>
  </div>

  <!-- সেটিংস বক্স -->
  <div id="settingsModal" class="modal">
    <div class="modal-box">
      <h3>Firebase সেটিংস</h3>
      <label>Database URL</label>
      <input type="text" id="inDbUrl" placeholder="https://...firebaseio.com" />
      <label>API Key</label>
      <input type="text" id="inApiKey" placeholder="AIza..." />
      <label>Project ID</label>
      <input type="text" id="inProjectId" placeholder="your-project-id" />
      <label>Messaging Sender ID</label>
      <input type="text" id="inSenderId" placeholder="1234567890" />
      <label>App ID</label>
      <input type="text" id="inAppId" placeholder="1:1234567890:web:..." />
      <label>VAPID Key</label>
      <input type="text" id="inVapidKey" placeholder="BEl62iUYg..." />
      <div class="modal-btns">
        <button type="button" class="btn" onclick="closeModal('settingsModal')">বন্ধ</button>
        <button type="button" class="save-btn" onclick="saveConfig()">সেভ করুন</button>
      </div>
    </div>
  </div>

  <script>
    var STORAGE_KEY = "miss_you_pulse_saved_v1";

    function getTodayDateStr() {
      var d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    var defaultState = {
      dateStr: getTodayDateStr(),
      myName: "আমি",
      partnerName: "hasi",
      myCount: 0,
      partnerCount: 0,
      lastMsg: "এখনও কোনো সিগন্যাল পাঠানো হয়নি ✨",
      config: {
        dbUrl: "",
        apiKey: "",
        projectId: "",
        senderId: "",
        appId: "",
        vapidKey: ""
      }
    };

    var appState = JSON.parse(JSON.stringify(defaultState));

    function loadSavedState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          appState.myName = parsed.myName || "আমি";
          appState.partnerName = parsed.partnerName || "hasi";
          appState.lastMsg = parsed.lastMsg || defaultState.lastMsg;
          appState.config = Object.assign({}, defaultState.config, parsed.config || {});

          if (parsed.dateStr === getTodayDateStr()) {
            appState.myCount = Number(parsed.myCount || 0);
            appState.partnerCount = Number(parsed.partnerCount || 0);
          } else {
            appState.dateStr = getTodayDateStr();
            appState.myCount = 0;
            appState.partnerCount = 0;
          }
        }
      } catch (e) {}
      persistState();
    }

    function persistState() {
      appState.dateStr = getTodayDateStr();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {}
    }

    function refreshUI() {
      document.getElementById("pairText").textContent = appState.myName + " ❤️ " + appState.partnerName;
      document.getElementById("myLabel").textContent = "আজ " + appState.myName;
      document.getElementById("partnerLabel").textContent = "আজ " + appState.partnerName;
      document.getElementById("myNum").textContent = appState.myCount;
      document.getElementById("partnerNum").textContent = appState.partnerCount;
      document.getElementById("lastMsg").textContent = appState.lastMsg;

      var statusEl = document.getElementById("statusText");
      if (appState.config.dbUrl) {
        statusEl.textContent = "● Firebase যুক্ত";
        statusEl.style.color = "#86efac";
      } else {
        statusEl.textContent = "● ফোনে সেভ হচ্ছে";
        statusEl.style.color = "#fde047";
      }
    }

    function openModal(id) {
      document.getElementById("inMyName").value = appState.myName;
      document.getElementById("inPartnerName").value = appState.partnerName;
      document.getElementById("inDbUrl").value = appState.config.dbUrl || "";
      document.getElementById("inApiKey").value = appState.config.apiKey || "";
      document.getElementById("inProjectId").value = appState.config.projectId || "";
      document.getElementById("inSenderId").value = appState.config.senderId || "";
      document.getElementById("inAppId").value = appState.config.appId || "";
      document.getElementById("inVapidKey").value = appState.config.vapidKey || "";
      document.getElementById(id).classList.add("show");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
    }

    function saveNames() {
      var m = document.getElementById("inMyName").value.trim();
      var p = document.getElementById("inPartnerName").value.trim();
      if (m) appState.myName = m;
      if (p) appState.partnerName = p;
      appState.lastMsg = "প্রোফাইল সেভ হয়েছে: " + appState.myName + " ❤️ " + appState.partnerName;
      persistState();
      refreshUI();
      closeModal("profileModal");
    }

    function saveConfig() {
      appState.config = {
        dbUrl: document.getElementById("inDbUrl").value.trim(),
        apiKey: document.getElementById("inApiKey").value.trim(),
        projectId: document.getElementById("inProjectId").value.trim(),
        senderId: document.getElementById("inSenderId").value.trim(),
        appId: document.getElementById("inAppId").value.trim(),
        vapidKey: document.getElementById("inVapidKey").value.trim()
      };
      appState.lastMsg = "Firebase সেটিংস ফোনে সেভ করা হয়েছে ✅";
      persistState();
      refreshUI();
      closeModal("settingsModal");
    }

    function addCount() {
      appState.myCount = Number(appState.myCount || 0) + 1;
      var nowTime = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      appState.lastMsg = appState.myName + " স্মরণ করেছেন (" + nowTime + ") ❤️";
      persistState();
      refreshUI();

      if (appState.config.dbUrl) {
        var cleanUrl = appState.config.dbUrl.replace(/\/+$/, "");
        var roomKey = encodeURIComponent([appState.myName.toLowerCase(), appState.partnerName.toLowerCase()].sort().join("__"));
        var dayKey = getTodayDateStr();

        fetch(cleanUrl + "/rooms/" + roomKey + "/dailyStats/" + dayKey + "/counts/" + encodeURIComponent(appState.myName.toLowerCase()) + ".json", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(appState.myCount)
        }).catch(function () {});

        fetch(cleanUrl + "/notificationQueue.json", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            toUser: appState.partnerName.toLowerCase(),
            fromUser: appState.myName,
            title: "দূরে থেকেও কাছে ❤️",
            body: appState.myName + " এই মুহূর্তে আপনাকে খুব স্মরণ করছেন!",
            createdAt: Date.now()
          })
        }).catch(function () {});
      }
    }

    function askNotify() {
      if (!("Notification" in window)) {
        appState.lastMsg = "এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই।";
        persistState();
        refreshUI();
        return;
      }
      Notification.requestPermission().then(function (perm) {
        if (perm === "granted") {
          new Notification("দূরে থেকেও কাছে ❤️", {
            body: appState.partnerName + "-এর জন্য নোটিফিকেশন অ্যালার্ট চালু হয়েছে!"
          });
          appState.lastMsg = "নোটিফিকেশন অ্যালার্ট চালু হয়েছে 🔔";
        } else {
          appState.lastMsg = "নোটিফিকেশন অনুমতি দেওয়া হয়নি।";
        }
        persistState();
        refreshUI();
      });
    }

    loadSavedState();
    refreshUI();
  </script>
</body>
</html>
