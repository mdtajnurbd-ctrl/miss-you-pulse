<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miss You Pulse ❤️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #2b094e, #120424);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      padding: 24px;
      text-align: center;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .pair-box {
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 0 20px;
      font-size: 14px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 14px;
    }
    .num { font-size: 32px; font-weight: 700; margin: 6px 0; }
    .big-heart-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: linear-gradient(145deg, #ff4d79, #b51746);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .big-heart-btn:active { transform: scale(0.92); }
    .last-msg {
      margin-top: 18px;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      border-radius: 14px;
      font-size: 13px;
      color: #f3d5de;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }
    .modal.show { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 360px;
      background: #240b42;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 22px;
      padding: 20px;
      text-align: left;
    }
    .modal-box h3 { margin-bottom: 12px; font-size: 18px; }
    .modal-box label { display: block; font-size: 13px; margin-bottom: 4px; color: #ddd; }
    .modal-box input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 14px;
      margin-bottom: 12px;
    }
    .modal-btns { display: flex; gap: 10px; }
    .save-btn {
      flex: 1;
      background: #ff4d79;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span id="statusText" style="font-size:13px; color:#86efac;">● সচল আছে</span>
      <div>
        <button type="button" class="btn" onclick="askNotify()">🔔 অ্যালার্ট</button>
        <button type="button" class="btn" onclick="openModal('settingsModal')">⚙️</button>
      </div>
    </div>

    <h2>দূরে থেকেও কাছে ❤️</h2>
    <p style="font-size:13px; color:#e5d4f7; margin-top:4px;">আজকের স্মরণের হিসাব</p>

    <div class="pair-box">
      <span id="pairText">আমি ❤️ hasi</span>
      <button type="button" class="btn" onclick="openModal('profileModal')">ইউজার বদলান</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div id="myLabel" style="font-size:12px; color:#e5d4f7;">আজ আমি</div>
        <div id="myNum" class="num">0</div>
        <div style="font-size:12px; color:#ffd166;">বার ❤️</div>
      </div>
      <div class="stat">
        <div id="partnerLabel" style="font-size:12px; color:#e5d4f7;">hasi</div>
        <div id="partnerNum" class="num">0</div>
        <div style="font-size:12px; color:#ffd166;">বার 💕</div>
      </div>
    </div>

    <button type="button" class="big-heart-btn" onclick="addCount()">
      <span style="font-size:34px;">💖</span>
      <span>মনে পড়ছে!</span>
    </button>

    <div id="lastMsg" class="last-msg">এখনও কোনো সিগন্যাল পাঠানো হয়নি ✨</div>
  </div>

  <!-- ইউজার বদলানোর বক্স -->
  <div id="profileModal" class="modal">
    <div class="modal-box">
      <h3>ইউজারনেম বদলান</h3>
      <label>আমার নাম / ইউজারনেম</label>
      <input type="text" id="inMyName" value="আমি" />
      <label>প্রিয়জনের নাম / ইউজারনেম</label>
      <input type="text" id="inPartnerName" value="hasi" />
      <div class="modal-btns">
        <button type="button" class="btn" onclick="closeModal('profileModal')">বন্ধ</button>
        <button type="button" class="save-btn" onclick="saveNames()">সেভ করুন</button>
      </div>
    </div>
  </div>

  <!-- সেটিংস বক্স -->
  <div id="settingsModal" class="modal">
    <div class="modal-box">
      <h3>Firebase সেটিংস</h3>
      <label>Database URL</label>
      <input type="text" id="inDbUrl" placeholder="https://...firebaseio.com" />
      <label>API Key</label>
      <input type="text" id="inApiKey" placeholder="AIza..." />
      <div class="modal-btns">
        <button type="button" class="btn" onclick="closeModal('settingsModal')">বন্ধ</button>
        <button type="button" class="save-btn" onclick="saveConfig()">সেভ করুন</button>
      </div>
    </div>
  </div>

  <script>
    var appState = {
      myName: "আমি",
      partnerName: "hasi",
      myCount: 0,
      partnerCount: 0,
      dbUrl: "",
      apiKey: ""
    };

    function refreshUI() {
      document.getElementById("pairText").textContent = appState.myName + " ❤️ " + appState.partnerName;
      document.getElementById("myLabel").textContent = "আজ " + appState.myName;
      document.getElementById("partnerLabel").textContent = "আজ " + appState.partnerName;
      document.getElementById("myNum").textContent = appState.myCount;
      document.getElementById("partnerNum").textContent = appState.partnerCount;
    }

    function openModal(id) {
      document.getElementById("inMyName").value = appState.myName;
      document.getElementById("inPartnerName").value = appState.partnerName;
      document.getElementById("inDbUrl").value = appState.dbUrl;
      document.getElementById("inApiKey").value = appState.apiKey;
      document.getElementById(id).classList.add("show");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("show");
    }

    function saveNames() {
      var m = document.getElementById("inMyName").value.trim();
      var p = document.getElementById("inPartnerName").value.trim();
      if (m) appState.myName = m;
      if (p) appState.partnerName = p;
      refreshUI();
      closeModal("profileModal");
      document.getElementById("lastMsg").textContent = "প্রোফাইল আপডেট হয়েছে: " + appState.myName + " ❤️ " + appState.partnerName;
    }

    function saveConfig() {
      appState.dbUrl = document.getElementById("inDbUrl").value.trim();
      appState.apiKey = document.getElementById("inApiKey").value.trim();
      closeModal("settingsModal");
      document.getElementById("lastMsg").textContent = "সেটিংস সেভ করা হয়েছে ✅";
    }

    function addCount() {
      appState.myCount = appState.myCount + 1;
      refreshUI();
      var nowTime = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      document.getElementById("lastMsg").textContent = appState.myName + " স্মরণ করেছেন (" + nowTime + ") ❤️";

      if (appState.dbUrl) {
        var cleanUrl = appState.dbUrl.replace(/\/+$/, "");
        fetch(cleanUrl + "/pulses.json", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            from: appState.myName,
            to: appState.partnerName,
            count: appState.myCount,
            time: nowTime
          })
        }).catch(function () {});
      }
    }

    function askNotify() {
      if (!("Notification" in window)) {
        document.getElementById("lastMsg").textContent = "এই ব্রাউজারে নোটিফিকেশন সাপোর্ট নেই।";
        return;
      }
      Notification.requestPermission().then(function (perm) {
        if (perm === "granted") {
          new Notification("দূরে থেকেও কাছে ❤️", {
            body: appState.partnerName + "-এর জন্য নোটিফিকেশন অ্যালার্ট চালু হয়েছে!"
          });
          document.getElementById("lastMsg").textContent = "নোটিফিকেশন অ্যালার্ট চালু হয়েছে 🔔";
        } else {
          document.getElementById("lastMsg").textContent = "নোটিফিকেশন অনুমতি দেওয়া হয়নি।";
        }
      });
    }

    refreshUI();
  </script>
</body>
</html>
